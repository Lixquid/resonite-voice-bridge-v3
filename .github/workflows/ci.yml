# Continuous integration for Resonite Voice Bridge.
#
# Runs on every commit (all branches) and on pull requests, verifying both
# projects:
#
#   - frontend: typechecks with tsc and builds with Vite. The build output
#     (frontend/dist) is uploaded as an artifact for the systray job.
#   - systray:  vets, builds and tests the Go module, embedding the frontend
#     dist produced by the frontend job (it is not committed: it lives in
#     the frontend's .gitignore).

name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `npm run build` runs `tsc --noEmit` (typecheck) followed by the
      # Vite production build.
      - name: Typecheck and build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          # A single path: the artifact archive root is frontend/dist itself,
          # so downloading into frontend/dist restores the exact layout that
          # frontend/embed.go expects.
          path: frontend/dist
          retention-days: 1

  systray:
    name: Systray
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build output
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Embed the version (short commit ID plus -dirty when applicable),
      # matching the Makefile logic in systray/version.go.
      - name: Build
        run: |
          VERSION="$(git rev-parse --short HEAD)"
          if [ -n "$(git status --porcelain)" ]; then
            VERSION="${VERSION}-dirty"
          fi
          echo "==> Embedding version: $VERSION"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o bin/resonite-voice-bridge ./systray
