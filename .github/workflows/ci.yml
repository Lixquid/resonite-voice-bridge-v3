# Continuous integration for Resonite Voice Bridge.
#
# Runs on every commit (all branches) and on pull requests. Everything is
# driven through the Makefile: `make vet` and `make test` check the Go module,
# and `make build` builds the frontend (tsc + Vite) and then the Go binary,
# embedding the frontend dist and the version string (short commit ID plus
# "-dirty" when the tree is unclean; checkout yields a clean tree, so CI
# builds embed the short SHA).

name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: resonite-voice-bridge
          path: bin/resonite-voice-bridge
          retention-days: 1
