# Release builds for Resonite Voice Bridge.
#
# Triggered by pushing a "v*" tag. Each matrix entry cross-compiles one
# platform via the Makefile, which handles everything: frontend install and
# build, version embedding (it picks up the tag name itself via
# `git tag --points-at HEAD`), Windows resource compilation (application
# icon), and -H=windowsgui linking for Windows builds. The built binary is
# then renamed to the release asset name and collected into a GitHub release.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: resonite-voice-bridge-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: resonite-voice-bridge-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: resonite-voice-bridge-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: resonite-voice-bridge-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: resonite-voice-bridge-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Cross-compile: the Makefile honours GOOS/GOARCH, switches the output
      # to bin/resonite-voice-bridge(.exe) and adds -H=windowsgui (plus the
      # rsrc icon resources) for Windows targets.
      - name: Build
        run: make build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Rename asset
        run: mv bin/resonite-voice-bridge* ${{ matrix.asset }}
        working-directory: bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: bin/${{ matrix.asset }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
